        with:
          name: FF-PRO-MAX-v4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Publicar APK en Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FF-PRO-MAX-v4.apk
          if gh release view v4 > /dev/null 2>&1; then
            gh release upload v4 FF-PRO-MAX-v4.apk --clobber
          else
            gh release create v4 FF-PRO-MAX-v4.apk --title "FF PRO MAX 4.0" --notes "Con diagnostico de errores en pantalla."
          fi
