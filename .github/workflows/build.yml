          cat > app/src/main/java/com/fftool/Logs.kt <<'EOF'
          package com.fftool

          import android.content.Context
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Logs {

              private var dir: File? = null
              private val fmt = SimpleDateFormat("HH:mm:ss", Locale.US)

              fun init(ctx: Context) {
                  if (dir == null) dir = ctx.applicationContext.filesDir
              }

              private fun archivo(nombre: String): File? = dir?.let { File(it, nombre) }

              @Synchronized
              fun event(msg: String) {
                  val f = archivo("eventos.txt") ?: return
                  try {
                      if (f.length() > 300_000) f.delete()
                      f.appendText(fmt.format(Date()) + "  " + msg + "\n")
                  } catch (t: Throwable) {
                  }
              }

              @Synchronized
              fun crash(t: Throwable) {
                  val f = archivo("ultimo_error.txt") ?: return
                  try {
                      f.writeText(
                          fmt.format(Date()) + "\n" +
                              t.javaClass.name + ": " + (t.message ?: "(sin mensaje)") + "\n\n" +
                              t.stackTraceToString() + "\n\n--- eventos ---\n" + leer("eventos.txt")
                      )
                  } catch (e: Throwable) {
                  }
              }

              fun leer(nombre: String): String {
                  val f = archivo(nombre) ?: return ""
                  return try {
                      if (f.exists()) f.readText() else ""
                  } catch (t: Throwable) {
                      ""
                  }
              }

              fun borrar(nombre: String) {
                  try {
                      archivo(nombre)?.delete()
                  } catch (t: Throwable) {
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/fftool/CrashHandler.kt <<'EOF'
          package com.fftool

          object CrashHandler {
              fun install() {
                  val previo = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { hilo, t ->
                      try {
                          Logs.event("CRASH " + t.javaClass.simpleName)
                          Logs.crash(t)
                      } catch (e: Throwable) {
                      }
                      previo?.uncaughtException(hilo, t)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/fftool/Config.kt <<'EOF'
          package com.fftool

          import android.content.Context
          import android.content.SharedPreferences

          object Config {

              private const val PREFS = "ff_promax_prefs"
              private var sp: SharedPreferences? = null

              fun init(ctx: Context) {
                  if (sp == null) {
                      sp = ctx.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  }
              }

              private val p: SharedPreferences
                  get() = sp ?: throw IllegalStateException("Config.init no llamado")

              private fun edit(b: (SharedPreferences.Editor) -> Unit) {
                  val e = p.edit()
                  b(e)
                  e.apply()
              }

              var enabled: Boolean
                  get() = p.getBoolean("enabled", true)
                  set(v) = edit { it.putBoolean("enabled", v) }

              var verZona: Boolean
                  get() = p.getBoolean("verZona", true)
                  set(v) = edit { it.putBoolean("verZona", v) }

              var modoSostener: Boolean
                  get() = p.getBoolean("modoSostener", false)
                  set(v) = edit { it.putBoolean("modoSostener", v) }

              var headFlick: Boolean
                  get() = p.getBoolean("headFlick", false)
                  set(v) = edit { it.putBoolean("headFlick", v) }

              var rojo: Int
                  get() = p.getInt("rojo", 115)
                  set(v) = edit { it.putInt("rojo", v.coerceIn(60, 250)) }

              var punto: Int
                  get() = p.getInt("punto", 5)
                  set(v) = edit { it.putInt("punto", v.coerceIn(2, 400)) }

              var zona: Int
                  get() = p.getInt("zona", 80)
                  set(v) = edit { it.putInt("zona", v.coerceIn(20, 400)) }

              var retardo: Long
                  get() = p.getLong("retardo", 110L)
                  set(v) = edit { it.putLong("retardo", v.coerceIn(16L, 800L)) }

              var tapMs: Long
                  get() = p.getLong("tapMs", 22L)
                  set(v) = edit { it.putLong("tapMs", v.coerceIn(8L, 600L)) }

              var head: Int
                  get() = p.getInt("head", 180)
                  set(v) = edit { it.putInt("head", v.coerceIn(40, 900)) }

              var offsetX: Int
                  get() = p.getInt("offsetX", 0)
                  set(v) = edit { it.putInt("offsetX", v.coerceIn(-300, 300)) }

              var offsetY: Int
                  get() = p.getInt("offsetY", 0)
                  set(v) = edit { it.putInt("offsetY", v.coerceIn(-300, 300)) }

              fun presetSuave() {
                  enabled = true
                  modoSostener = false
                  headFlick = false
                  rojo = 135
                  punto = 9
                  zona = 60
                  retardo = 170L
                  tapMs = 25L
                  head = 160
                  offsetX = 0
                  offsetY = 0
              }

              fun presetNormal() {
                  enabled = true
                  modoSostener = false
                  headFlick = false
                  rojo = 115
                  punto = 5
                  zona = 80
                  retardo = 110L
                  tapMs = 22L
