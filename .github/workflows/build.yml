                      }
                  }, lp(matchW = true, h = dp(50), top = dp(8)))

                  col.addView(TextView(this).apply {
                      text = "DIAGNOSTICO (seleccionable)"
                      setTextColor(0xFF66FF99.toInt())
                      textSize = 13f
                      setTypeface(Typeface.DEFAULT_BOLD)
