          package com.fftool

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView

          class OverlayService : Service() {

              private var wm: WindowManager? = null
              private var panel: LinearLayout? = null
              private var zonaView: View? = null
              private var zonaParams: WindowManager.LayoutParams? = null

              private lateinit var estado: TextView
              private lateinit var ajustes: LinearLayout
              private lateinit var modoBtn: TextView
              private val filas = HashMap<String, TextView>()
              private var abierto = false

              private val ui = Handler(Looper.getMainLooper())

              private val tick = object : Runnable {
                  override fun run() {
                      try {
                          render()
                          refrescarZona()
                      } catch (t: Throwable) {
                      }
                      ui.postDelayed(this, 700)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Config.init(this)
                  Logs.event("panel creado")
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  try {
                      build()
                      crearZona()
                  } catch (t: Throwable) {
                      Logs.event("panel fallo: " + t.javaClass.simpleName + ": " + t.message)
                      Logs.crash(t)
                  }
                  ui.post(tick)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  running = true
                  return START_STICKY
              }

              override fun onDestroy() {
                  ui.removeCallbacks(tick)
                  try {
                      panel?.let { wm?.removeView(it) }
                  } catch (t: Throwable) {
                  }
                  try {
                      zonaView?.let { wm?.removeView(it) }
                  } catch (t: Throwable) {
                  }
                  panel = null
                  zonaView = null
                  running = false
                  Logs.event("panel cerrado")
                  super.onDestroy()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun boton(label: String, accion: () -> Unit): TextView {
                  return TextView(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = 10f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(6), 0, dp(6))
                      setBackgroundColor(0xFF23232E.toInt())
                      setOnClickListener { accion() }
                  }
              }

              private fun fila(label: String, valor: () -> Int, menos: () -> Unit, mas: () -> Unit): LinearLayout {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val lbl = TextView(this).apply {
                      text = label + " " + valor()
                      setTextColor(0xFFBBBBBB.toInt())
                      textSize = 9f
                      setPadding(dp(3), 0, dp(3), 0)
                  }
                  filas[label] = lbl
                  row.addView(lbl, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                  val bm = TextView(this).apply {
                      text = "-"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xFF2E2E3A.toInt())
                      setOnClickListener { menos(); render() }
                  }
                  val bp = TextView(this).apply {
                      text = "+"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setBackgroundColor(0xFF2E2E3A.toInt())
                      setOnClickListener { mas(); render() }
                  }
                  row.addView(bm, LinearLayout.LayoutParams(dp(26), dp(24)))
                  row.addView(bp, LinearLayout.LayoutParams(dp(26), dp(24)))
                  return row
              }

              private fun build() {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(7), dp(7), dp(7), dp(7))
                      setBackgroundColor(0xE6101014.toInt())
                  }

                  val head = TextView(this).apply {
                      text = "FF PRO MAX"
                      setTextColor(0xFFFF3B30.toInt())
                      textSize = 12f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, dp(3), 0, dp(3))
                  }
                  col.addView(head)

                  estado = TextView(this).apply {
                      setTextColor(0xFF9AE6B4.toInt())
                      textSize = 9f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, dp(5))
                  }
                  col.addView(estado)

                  col.addView(boton("ON / OFF") {
                      Config.enabled = !Config.enabled
                      render()
                  })
                  col.addView(boton("SUAVE") { Config.presetSuave(); render() })
                  col.addView(boton("NORMAL") { Config.presetNormal(); render() })
                  col.addView(boton("DURO") { Config.presetDuro(); render() })
                  col.addView(boton("VER ZONA") { Config.verZona = !Config.verZona; render() })
                  col.addView(boton("AJUSTES") {
                      abierto = !abierto
                      ajustes.visibility = if (abierto) View.VISIBLE else View.GONE
                  })

                  ajustes = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                  }
                  ajustes.addView(fila("RETARDO", { Config.retardo.toInt() }, { Config.retardo -= 15 }, { Config.retardo += 15 }))
                  ajustes.addView(fila("ROJO", { Config.rojo }, { Config.rojo -= 5 }, { Config.rojo += 5 }))
                  ajustes.addView(fila("PUNTO", { Config.punto }, { Config.punto -= 1 }, { Config.punto += 1 }))
                  ajustes.addView(fila("ZONA", { Config.zona }, { Config.zona -= 10 }, { Config.zona += 10 }))
                  ajustes.addView(fila("TAP", { Config.tapMs.toInt() }, { Config.tapMs -= 4 }, { Config.tapMs += 4 }))
                  ajustes.addView(fila("HEAD", { Config.head }, { Config.head -= 20 }, { Config.head += 20 }))
                  ajustes.addView(fila("OFF X", { Config.offsetX }, { Config.offsetX -= 4 }, { Config.offsetX += 4 }))
                  ajustes.addView(fila("OFF Y", { Config.offsetY }, { Config.offsetY -= 4 }, { Config.offsetY += 4 }))

                  modoBtn = boton("MODO: TOQUES") {
                      Config.modoSostener = !Config.modoSostener
                      render()
                  }
                  ajustes.addView(modoBtn)

                  ajustes.addView(boton("HEAD FLICK") {
                      Config.headFlick = !Config.headFlick
                      render()
                  })

                  col.addView(ajustes)

                  col.addView(boton("CERRAR PANEL") { stopSelf() })

                  val params = WindowManager.LayoutParams(
                      dp(126),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(6)
                      y = dp(90)
                  }

                  var dx = 0f
                  var dy = 0f
                  head.setOnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              dx = ev.rawX - params.x
                              dy = ev.rawY - params.y
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = (ev.rawX - dx).toInt()
                              params.y = (ev.rawY - dy).toInt()
                              try {
                                  wm?.updateViewLayout(panel, params)
                              } catch (t: Throwable) {
                              }
                              true
                          }
                          else -> true
                      }
                  }

                  panel = col
                  wm?.addView(col, params)
                  render()
              }

              private fun crearZona() {
                  if (zonaView != null) return
                  val v = View(this).apply {
                      background = GradientDrawable().apply {
                          setColor(0x00000000)
                          setStroke(dp(2), 0xFF00E5FF.toInt())
                          cornerRadius = dp(6).toFloat()
                      }
                  }
                  val p = WindowManager.LayoutParams(
                      dp(160),
                      dp(160),
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                  }
                  zonaParams = p
                  zonaView = v
                  wm?.addView(v, p)
              }

              @Suppress("DEPRECATION")
              private fun pantalla(): Pair<Int, Int> {
                  val wm2 = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      val b = wm2.currentWindowMetrics.bounds
                      return b.width() to b.height()
                  }
                  val dm = DisplayMetrics()
                  wm2.defaultDisplay.getRealMetrics(dm)
                  return dm.widthPixels to dm.heightPixels
              }

              private fun refrescarZona() {
                  val v = zonaView ?: return
                  val p = zonaParams ?: return

                  if (!Config.verZona) {
                      if (v.visibility != View.GONE) v.visibility = View.GONE
                      return
                  }
                  if (v.visibility != View.VISIBLE) v.visibility = View.VISIBLE

                  val size = (Config.zona * 2).coerceAtLeast(20)
                  if (p.width != size || p.height != size) {
                      p.width = size
                      p.height = size
                  }
                  val (sw, sh) = pantalla()
                  p.x = (sw / 2 + Config.offsetX) - size / 2
                  p.y = (sh / 2 + Config.offsetY) - size / 2
                  try {
                      wm?.updateViewLayout(v, p)
                  } catch (t: Throwable) {
                  }
              }

              private fun render() {
                  val st = when {
                      !Config.enabled -> "EN PAUSA"
                      TouchAccessibilityService.ready() -> "ACTIVO"
                      else -> "FALTA ACCESIBILIDAD"
                  }
                  estado.text = st + "\nrojo " + Config.rojo + " · punto " + Config.punto + "\nzona " + Config.zona + " · retardo " + Config.retardo + "ms\n" + (if (Config.headFlick) "HEAD " + Config.head + "px" else "HEAD off")

                  filas["RETARDO"]?.text = "RETARDO " + Config.retardo
                  filas["ROJO"]?.text = "ROJO " + Config.rojo
                  filas["PUNTO"]?.text = "PUNTO " + Config.punto
                  filas["ZONA"]?.text = "ZONA " + Config.zona
                  filas["TAP"]?.text = "TAP " + Config.tapMs
                  filas["HEAD"]?.text = "HEAD " + Config.head
                  filas["OFF X"]?.text = "OFF X " + Config.offsetX
                  filas["OFF Y"]?.text = "OFF Y " + Config.offsetY

                  modoBtn.text = if (Config.modoSostener) "MODO: SOSTENER" else "MODO: TOQUES"
              }

              companion object {
                  @Volatile
                  private var running = false

                  fun isShowing(): Boolean = running

                  fun show(ctx: Context) {
                      if (!Settings.canDrawOverlays(ctx)) {
                          Logs.event("sin permiso de superposicion")
                          return
                      }
                      running = true
                      ctx.startService(Intent(ctx, OverlayService::class.java))
                  }

                  fun hide(ctx: Context) {
                      running = false
                      ctx.stopService(Intent(ctx, OverlayService::class.java))
                  }
              }
          }
