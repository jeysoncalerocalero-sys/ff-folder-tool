name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 fijo
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Reacomodar proyecto
        run: |
          set -e
          rm -rf /tmp/p
          mkdir -p /tmp/p
          cp -r ".github/workflows/app" /tmp/p/app
          cp .github/workflows/build.gradle.kts /tmp/p/
          cp .github/workflows/settings.gradle.kts /tmp/p/
          cp .github/workflows/gradle.properties /tmp/p/

          # el java quedo doblemente anidado, lo subimos a su lugar
          mkdir -p /tmp/p/app/src/main/java/com/fftool
          mv /tmp/p/app/src/main/app/src/main/java/com/fftool/MainActivity.java \
             /tmp/p/app/src/main/java/com/fftool/MainActivity.java
          rm -rf /tmp/p/app/src/main/app

          # los assets viven en la raiz, van dentro del modulo
          mkdir -p /tmp/p/app/src/main/assets/ff
          cp app/src/main/assets/ff/* /tmp/p/app/src/main/assets/ff/ 2>/dev/null || true

          echo "=== estructura final ==="
          find /tmp/p -type f | sort

      - name: Compilar APK
        run: |
          set +e
          cd /tmp/p
          gradle assembleDebug --stacktrace > /tmp/build.log 2>&1
          code=$?
          set -e
          echo "############ CABECERA DEL ERROR ############"
          head -n 120 /tmp/build.log
          echo "############ FIN DE LA CABECERA ############"
          exit $code

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ff-folder-tool-apk
          path: /tmp/p/app/build/outputs/apk/debug/app-debug.apk
