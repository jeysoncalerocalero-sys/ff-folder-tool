name: FF PRO MAX

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 34
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Generar proyecto
        run: |
          set -e
          mkdir -p app/src/main/java/com/fftool
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets/ff

          SRC="$(find . -path '*/assets/ff' -type d -not -path './.git/*' | head -n1)"
          if [ -n "$SRC" ] && [ "$SRC" != "./app/src/main/assets/ff" ]; then
            cp -rn "$SRC"/. app/src/main/assets/ff/ 2>/dev/null || true
          fi

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FFProMax"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fftool"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.fftool"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.documentfile:documentfile:1.0.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:name=".App"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".FolderActivity"
                      android:exported="false"
                      android:label="@string/folder_title" />

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <service
                      android:name=".OverlayService"
                      android:exported="false" />

                  <service
                      android:name=".TouchAccessibilityService"
                      android:exported="true"
                      android:label="@string/a11y_label"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">FF PRO MAX</string>
              <string name="folder_title">Archivos del juego</string>
              <string name="a11y_label">FF PRO MAX · Disparo externo</string>
              <string name="a11y_desc">Inyecta toques en pantalla para el auto disparo. No toca el proceso del juego, asi que es anti ban.</string>
              <string name="notif_channel_capture">Captura de pantalla</string>
              <string name="notif_channel_capture_desc">Analiza el centro de la pantalla buscando el punto rojo</string>
              <string name="notif_capture_title">FF PRO MAX activo</string>
              <string name="notif_capture_text">Buscando rojo en el centro</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/a11y_desc"
              android:summary="@string/a11y_desc" />
          EOF

          cat > app/src/main/java/com/fftool/App.kt <<'EOF'
          package com.fftool

          import android.app.Application

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  Config.init(this)
                  Logs.init(this)
                  CrashHandler.install()
                  Logs.event("app iniciada v4")
              }
          }
          EOF

          cat > app/src/main/java/com/fftool/Logs.kt <<'EOF'
          package com.fftool

          import android.content.Context
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Logs {

              private var dir: File? = null
              private val fmt = SimpleDateFormat("HH:mm:ss", Locale.US)

              fun init(ctx: Context) {
                  if (dir == null) dir = ctx.applicationContext.filesDir
              }

              private fun archivo(nombre: String): File? = dir?.let { File(it, nombre) }

              @Synchronized
              fun event(msg: String) {
                  val f = archivo("eventos.txt") ?: return
                  try {
                      if (f.length() > 300_000) f.delete()
                      f.appendText(fmt.format(Date()) + "  " + msg + "\n")
                  } catch (t: Throwable) {
                  }
              }

              @Synchronized
              fun crash(t: Throwable) {
                  val f = archivo("ultimo_error.txt") ?: return
                  try {
                      f.writeText(
                          fmt.format(Date()) + "\n" +
                              t.javaClass.name + ": " + (t.message ?: "(sin mensaje)") + "\n\n" +
                              t.stackTraceToString() + "\n\n--- eventos ---\n" + leer("eventos.txt")
                      )
                  } catch (e: Throwable) {
                  }
              }

              fun leer(nombre: String): String {
                  val f = archivo(nombre) ?: return ""
                  return try {
                      if (f.exists()) f.readText() else ""
                  } catch (t: Throwable) {
                      ""
                  }
              }

              fun borrar(nombre: String) {
                  try {
                      archivo(nombre)?.delete()
                  } catch (t: Throwable) {
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/fftool/CrashHandler.kt <<'EOF'
          package com.fftool

          object CrashHandler {
              fun install() {
                  val previo = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { hilo, t ->
                      try {
                          Logs.event("CRASH " + t.javaClass.simpleName)
                          Logs.crash(t)
                      } catch (e: Throwable) {
                      }
                      previo?.uncaughtException(hilo, t)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/fftool/Config.kt <<'EOF'
          package com.fftool

          import android.content.Context
          import android.content.SharedPreferences

          object Config {

              private const val PREFS = "ff_promax_prefs"

              private var sp: SharedPreferences? = null

              fun init(ctx: Context) {
                  if (sp == null) {
                      sp = ctx.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  }
              }

              private val p: SharedPreferences
                  get() = sp ?: throw IllegalStateException("Config.init no llamado")

              private fun edit(block: (SharedPreferences.Editor) -> Unit) {
                  val e = p.edit()
                  block(e)
                  e.apply()
              }

              var enabled: Boolean
                  get() = p.getBoolean("enabled", true)
                  set(v) = edit { it.putBoolean("enabled", v) }

              var redMin: Int
                  get() = p.getInt("redMin", 110)
                  set(v) = edit { it.putInt("redMin", v.coerceIn(60, 250)) }

              var minPixels: Int
                  get() = p.getInt("minPixels", 5)
                  set(v) = edit { it.putInt("minPixels", v.coerceIn(2, 400)) }

              var regionHalf: Int
                  get() = p.getInt("regionHalf", 30)
                  set(v) = edit { it.putInt("regionHalf", v.coerceIn(6, 200)) }

              var fireIntervalMs: Long
                  get() = p.getLong("fireIntervalMs", 40L)
                  set(v) = edit { it.putLong("fireIntervalMs", v.coerceIn(16L, 400L)) }

              var tapMs: Long
                  get() = p.getLong("tapMs", 25L)
                  set(v) = edit { it.putLong("tapMs", v.coerceIn(8L, 120L)) }

              var headFlick: Boolean
                  get() = p.getBoolean("headFlick", false)
                  set(v) = edit { it.putBoolean("headFlick", v) }

              var flickPx: Int
                  get() = p.getInt("flickPx", 180)
                  set(v) = edit { it.putInt("flickPx", v.coerceIn(40, 900)) }

              var flickMs: Long
                  get() = p.getLong("flickMs", 60L)
                  set(v) = edit { it.putLong("flickMs", v.coerceIn(20L, 250L)) }

              var offsetX: Int
                  get() = p.getInt("offsetX", 0)
                  set(v) = edit { it.putInt("offsetX", v.coerceIn(-200, 200)) }

              var offsetY: Int
                  get() = p.getInt("offsetY", 0)
                  set(v) = edit { it.putInt("offsetY", v.coerceIn(-200, 200)) }

              fun presetDuro() {
                  enabled = true
                  headFlick = true
                  redMin = 115
                  minPixels = 5
                  regionHalf = 46
                  fireIntervalMs = 22L
                  tapMs = 18L
                  flickPx = 300
                  flickMs = 45L
                  offsetX = 0
                  offsetY = 0
              }
          }
          EOF

          cat > app/src/main/java/com/fftool/TouchAccessibilityService.kt <<'EOF'
          package com.fftool

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent

          class TouchAccessibilityService : AccessibilityService() {

              private val ui = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  instance = this
                  Logs.event("accesibilidad conectada")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onDestroy() {
                  instance = null
                  Logs.event("accesibilidad desconectada")
                  super.onDestroy()
              }

              fun tap(x: Float, y: Float, ms: Long, then: (() -> Unit)? = null) {
                  val path = Path().apply { moveTo(x, y) }
                  send(path, ms.coerceAtLeast(8L), then)
              }

              fun flick(x: Float, y: Float, dx: Float, dy: Float, ms: Long, then: (() -> Unit)? = null) {
                  val path = Path().apply {
                      moveTo(x, y)
                      lineTo(x + dx, y + dy)
                  }
                  send(path, ms.coerceAtLeast(16L), then)
              }

              private fun send(path: Path, ms: Long, then: (() -> Unit)?) {
                  try {
                      val stroke = GestureDescription.StrokeDescription(path, 0L, ms)
                      val gesture = GestureDescription.Builder().addStroke(stroke).build()
                      val cb = object : GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) {
                              ui.post { then?.invoke() }
                          }

                          override fun onCancelled(g: GestureDescription?) {
                              ui.post { then?.invoke() }
                          }
                      }
                      dispatchGesture(gesture, cb, null)
                  } catch (t: Throwable) {
                      Logs.event("gesto fallo: " + t.message)
                      then?.invoke()
                  }
              }

              companion object {
                  @Volatile
                  var instance: TouchAccessibilityService? = null

                  fun ready(): Boolean = instance != null
              }
          }
          EOF

          cat > app/src/main/java/com/fftool/CaptureService.kt <<'EOF'
          package com.fftool

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import java.util.concurrent.atomic.AtomicBoolean

          class CaptureService : Service() {

              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var thread: HandlerThread? = null
              private var handler: Handler? = null

              private var screenW = 0
              private var screenH = 0
              private val scale = 4

              private var codigo = 0
              private var datos: Intent? = null
              private var intentos = 0

              private var frames = 0
              private var erroresFrame = 0

              private val busy = AtomicBoolean(false)
              private var lastFire = 0L
              private val ui = Handler(Looper.getMainLooper())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Config.init(this)
                  Logs.event("CaptureService creado")
                  try {
                      createChannel()
                  } catch (t: Throwable) {
                      Logs.event("canal fallo: " + t.message)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  try {
                      startForegroundSafe()
                  } catch (t: Throwable) {
                      Logs.event("startForeground fallo: " + t.javaClass.simpleName + ": " + t.message)
                  }

                  val c = intent?.getIntExtra("code", 0) ?: 0
                  @Suppress("DEPRECATION")
                  val d = intent?.getParcelableExtra<Intent>("data")

                  if (c != 0 && d != null) {
                      codigo = c
                      datos = d
                      intentos = 0
                      Logs.event("onStartCommand con permiso, esperando para abrir proyeccion")
                      ui.postDelayed({ abrirProyeccion() }, 400L)
                  } else {
                      Logs.event("onStartCommand sin datos (reinicio del sistema)")
                  }
                  return START_STICKY
              }

              private fun abrirProyeccion() {
                  val d = datos ?: return
                  try {
                      preparar(codigo, d)
                      Logs.event("proyeccion lista " + screenW + "x" + screenH)
                  } catch (t: Throwable) {
                      intentos++
                      Logs.event("abrirProyeccion fallo intento " + intentos + ": " + t.javaClass.simpleName + ": " + t.message)
                      if (intentos < 5) {
                          ui.postDelayed({ abrirProyeccion() }, 800L)
                      } else {
                          Logs.crash(t)
                      }
                  }
              }

              private fun startForegroundSafe() {
                  val n = notification()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(7, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(7, n)
                  }
              }

              private fun notification(): Notification {
                  return NotificationCompat.Builder(this, CHANNEL)
                      .setContentTitle(getString(R.string.notif_capture_title))
                      .setContentText(getString(R.string.notif_capture_text))
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setOngoing(true)
                      .build()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      if (nm.getNotificationChannel(CHANNEL) == null) {
                          val ch = NotificationChannel(
                              CHANNEL,
                              getString(R.string.notif_channel_capture),
                              NotificationManager.IMPORTANCE_LOW
                          )
                          ch.description = getString(R.string.notif_channel_capture_desc)
                          nm.createNotificationChannel(ch)
                      }
                  }
              }

              @Suppress("DEPRECATION")
              private fun preparar(c: Int, d: Intent) {
                  stopProjection()

                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val metrics = DisplayMetrics()
                  wm.defaultDisplay.getRealMetrics(metrics)
                  screenW = metrics.widthPixels
                  screenH = metrics.heightPixels

                  val bmpW = (screenW / scale).coerceAtLeast(2)
                  val bmpH = (screenH / scale).coerceAtLeast(2)

                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val proj = mpm.getMediaProjection(c, d)
                      ?: throw IllegalStateException("getMediaProjection devolvio null")
                  projection = proj

                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          Logs.event("proyeccion revocada por el sistema")
                          stopProjection()
                      }
                  }, ui)

                  thread = HandlerThread("ff-capture").also { it.start() }
                  handler = Handler(thread!!.looper)
                  reader = ImageReader.newInstance(bmpW, bmpH, PixelFormat.RGBA_8888, 3)

                  display = proj.createVirtualDisplay(
                      "ff-pro-max",
                      bmpW,
                      bmpH,
                      metrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      reader!!.surface,
                      null,
                      handler
                  )

                  reader?.setOnImageAvailableListener({ r -> onFrame(r) }, handler)
                  Config.enabled = true
                  frames = 0
                  erroresFrame = 0
              }

              private fun onFrame(r: ImageReader) {
                  val image: Image = try {
                      r.acquireLatestImage()
                  } catch (t: Throwable) {
                      return
                  }

                  try {
                      if (!Config.enabled) return
                      if (busy.get()) return
                      val ahora = SystemClock.uptimeMillis()
                      if (ahora - lastFire < Config.fireIntervalMs) return

                      val plane = image.planes[0]
                      val buf = plane.buffer
                      val rowStride = plane.rowStride
                      val pixStride = plane.pixelStride
                      val w = image.width
                      val h = image.height

                      val cx = w / 2
                      val cy = h / 2
                      val half = Config.regionHalf
                      val left = (cx - half).coerceAtLeast(0)
                      val top = (cy - half).coerceAtLeast(0)
                      val right = (cx + half).coerceAtMost(w - 1)
                      val bottom = (cy + half).coerceAtMost(h - 1)

                      val redMin = Config.redMin
                      val maxOtros = redMin * 60 / 100

                      val fila = ByteArray(rowStride)
                      var sx = 0
                      var sy = 0
                      var n = 0

                      var y = top
                      while (y <= bottom) {
                          val pos = y * rowStride
                          if (pos >= buf.limit()) break
                          buf.position(pos)
                          val len = minOf(rowStride, buf.remaining())
                          if (len <= 0) break
                          buf.get(fila, 0, len)
                          var x = left
                          while (x <= right) {
                              val o = x * pixStride
                              if (o + 2 < len) {
                                  val rr = fila[o].toInt() and 0xFF
                                  val gg = fila[o + 1].toInt() and 0xFF
                                  val bb = fila[o + 2].toInt() and 0xFF
                                  if (rr >= redMin && gg <= maxOtros && bb <= maxOtros) {
                                      sx += x
                                      sy += y
                                      n++
                                  }
                              }
                              x++
                          }
                          y++
                      }

                      frames++
                      if (frames == 1) Logs.event("primer frame " + w + "x" + h + " stride " + rowStride + " pix " + pixStride)

                      if (n >= Config.minPixels) {
                          val bx = sx / n
                          val by = sy / n
                          fire((bx.toFloat() * scale) + Config.offsetX, (by.toFloat() * scale) + Config.offsetY)
                      }
                  } catch (t: Throwable) {
                      erroresFrame++
                      if (erroresFrame <= 5) {
                          Logs.event("error en frame: " + t.javaClass.simpleName + ": " + t.message)
                      }
                  } finally {
                      try {
                          image.close()
                      } catch (t: Throwable) {
                      }
                  }
              }

              private fun fire(x: Float, y: Float) {
                  val svc = TouchAccessibilityService.instance ?: return
                  if (!busy.compareAndSet(false, true)) return
                  lastFire = SystemClock.uptimeMillis()

                  if (Config.headFlick) {
                      svc.flick(x, y, 0f, -Config.flickPx.toFloat(), Config.flickMs) {
                          svc.tap(x, y, Config.tapMs) { busy.set(false) }
                      }
                  } else {
                      svc.tap(x, y, Config.tapMs) { busy.set(false) }
                  }

                  ui.postDelayed({ busy.set(false) }, 400L)
              }

              private fun stopProjection() {
                  val p = projection
                  projection = null
                  try {
                      reader?.setOnImageAvailableListener(null, null)
                  } catch (t: Throwable) {
                  }
                  try {
                      display?.release()
                  } catch (t: Throwable) {
                  }
                  try {
                      reader?.close()
                  } catch (t: Throwable) {
                  }
                  try {
                      p?.stop()
                  } catch (t: Throwable) {
                  }
                  display = null
                  reader = null
                  thread?.quitSafely()
                  thread = null
                  handler = null
              }

              override fun onDestroy() {
                  Logs.event("CaptureService destruido")
                  stopProjection()
                  super.onDestroy()
              }

              companion object {
                  const val CHANNEL = "ff_promax_capture"

                  fun start(ctx: Context, code: Int, data: Intent) {
                      val i = Intent(ctx, CaptureService::class.java)
                      i.putExtra("code", code)
                      i.putExtra("data", data)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          ctx.startForegroundService(i)
                      } else {
                          ctx.startService(i)
                      }
                  }

                  fun stop(ctx: Context) {
                      ctx.stopService(Intent(ctx, CaptureService::class.java))
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/fftool/OverlayService.kt <<'EOF'
          package com.fftool

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView

          class OverlayService : Service() {

              private var wm: WindowManager? = null
              private var panel: LinearLayout? = null
              private lateinit var estado: TextView
              private val ui = Handler(Looper.getMainLooper())

              private val tick = object : Runnable {
                  override fun run() {
                      try {
                          render()
                      } catch (t: Throwable) {
                      }
                      ui.postDelayed(this, 600)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Config.init(this)
                  Logs.event("panel flotante creado")
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  try {
                      build()
                  } catch (t: Throwable) {
                      Logs.event("panel fallo: " + t.javaClass.simpleName + ": " + t.message)
                      Logs.crash(t)
                  }
                  ui.post(tick)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  running = true
                  return START_STICKY
              }

              override fun onDestroy() {
                  ui.removeCallbacks(tick)
                  panel?.let {
                      try {
                          wm?.removeView(it)
                      } catch (t: Throwable) {
                      }
                  }
                  panel = null
                  running = false
                  Logs.event("panel flotante cerrado")
                  super.onDestroy()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun build() {
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      setBackgroundColor(0xCC14141C.toInt())
                  }

                  val head = TextView(this).apply {
                      text = "FF PRO MAX"
                      setTextColor(0xFFFF3B30.toInt())
                      textSize = 13f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, dp(6))
                  }
                  col.addView(head)

                  estado = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 10f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, dp(6))
                  }
                  col.addView(estado)

                  col.addView(boton("ON / OFF") {
                      Config.enabled = !Config.enabled
                      render()
                  })
                  col.addView(boton("DURO") {
                      Config.presetDuro()
                      render()
                  })
                  col.addView(boton("HEAD FLICK") {
                      Config.headFlick = !Config.headFlick
                      render()
                  })
                  col.addView(boton("MAS SENSIBLE +") { ajustar(1) })
                  col.addView(boton("MENOS -") { ajustar(-1) })
                  col.addView(boton("CERRAR PANEL") { stopSelf() })

                  val params = WindowManager.LayoutParams(
                      dp(104),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(8)
                      y = dp(140)
                  }

                  var dx = 0f
                  var dy = 0f
                  head.setOnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              dx = ev.rawX - params.x
                              dy = ev.rawY - params.y
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = (ev.rawX - dx).toInt()
                              params.y = (ev.rawY - dy).toInt()
                              try {
                                  wm?.updateViewLayout(panel, params)
                              } catch (t: Throwable) {
                              }
                              true
                          }
                          else -> true
                      }
                  }

                  panel = col
                  wm?.addView(col, params)
                  render()
              }

              private fun boton(label: String, accion: () -> Unit): TextView {
                  return TextView(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(7), 0, dp(7))
                      setBackgroundColor(0xFF23232E.toInt())
                      setOnClickListener { accion() }
                  }
              }

              private fun ajustar(dir: Int) {
                  Config.redMin = Config.redMin - (8 * dir)
                  Config.minPixels = Config.minPixels - dir
                  render()
              }

              private fun render() {
                  val st = when {
                      !Config.enabled -> "EN PAUSA"
                      TouchAccessibilityService.ready() -> "ACTIVO"
                      else -> "FALTA ACCESIBILIDAD"
                  }
                  val hf = if (Config.headFlick) "HEAD " + Config.flickPx + "px" else "HEAD off"
                  estado.text = st + "\nrojo " + Config.redMin + " · " + Config.minPixels + "px\nzona " + Config.regionHalf + "\ncadencia " + Config.fireIntervalMs + "ms\n" + hf
              }

              companion object {
                  @Volatile
                  private var running = false

                  fun isShowing(): Boolean = running

                  fun show(ctx: Context) {
                      if (!Settings.canDrawOverlays(ctx)) {
                          Logs.event("no se puede mostrar panel: falta permiso")
                          return
                      }
                      running = true
                      ctx.startService(Intent(ctx, OverlayService::class.java))
                  }

                  fun hide(ctx: Context) {
                      running = false
                      ctx.stopService(Intent(ctx, OverlayService::class.java))
                  }
              }
          }
