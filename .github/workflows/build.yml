name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7 fijo
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Diagnostico
        run: |
          echo "=== GRADLE ==="
          which gradle
          gradle --version
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "=== ARBOL DEL REPO ==="
          ls -R
          echo "=== ARCHIVOS CLAVE ==="
          for f in settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            echo "----- $f -----"
            cat "$f" 2>/dev/null || echo "NO EXISTE"
          done

      - name: Compilar APK
        run: |
          set +e
          gradle assembleDebug --stacktrace > /tmp/build.log 2>&1
          code=$?
          set -e
          echo "############ CABECERA DEL ERROR ############"
          head -n 80 /tmp/build.log
          echo "############ FIN DE LA CABECERA ############"
          exit $code

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ff-folder-tool-apk
          path: app/build/outputs/apk/debug/app-debug.apk
