          package com.fftool;

          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.documentfile.provider.DocumentFile;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class FolderActivity extends AppCompatActivity {

              private static final String PREF = "cfg";
              private static final String K_DIR = "dir";
              private static final int PICK_TREE = 101;

              private SharedPreferences sp;
              private EditText dirField;
              private TextView log;

              @Override
              protected void onCreate(@Nullable Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences(PREF, MODE_PRIVATE);

                  ScrollView sc = new ScrollView(this);
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(18), dp(28), dp(18), dp(28));
                  col.setBackgroundColor(0xFF0E0E12);
                  sc.addView(col);
                  setContentView(sc);

                  TextView title = new TextView(this);
                  title.setText("ARCHIVOS DEL JUEGO");
                  title.setTextColor(0xFFFF3B30);
                  title.setTextSize(22f);
                  title.setGravity(Gravity.CENTER);
                  col.addView(title);

                  TextView info = new TextView(this);
                  info.setText("Copia los archivos que pusiste en assets/ff hacia la carpeta del juego. En Android 11+ usa el selector, la ruta escrita suele fallar por la restriccion de Android/data.");
                  info.setTextColor(0xFFAAAAAA);
                  info.setTextSize(12f);
                  col.addView(info);

                  dirField = new EditText(this);
                  dirField.setHint("/storage/emulated/0/Android/data/com.dts.freefireth/files/");
                  dirField.setTextColor(Color.WHITE);
                  dirField.setHintTextColor(0xFF777788);
                  dirField.setText(sp.getString(K_DIR, ""));
                  col.addView(dirField);

                  col.addView(btn("Copiar a la ruta escrita", v -> copiarAManual()));
                  col.addView(btn("Elegir carpeta del juego (selector)", v -> elegirCarpeta()));
                  col.addView(btn("Backup de lo que hay en la carpeta", v -> backup()));
                  col.addView(btn("Usar ruta de Free Fire", v ->
                          dirField.setText("/storage/emulated/0/Android/data/com.dts.freefireth/files/")));
                  col.addView(btn("Usar ruta de Free Fire MAX", v ->
                          dirField.setText("/storage/emulated/0/Android/data/com.dts.freefiremax/files/")));

                  log = new TextView(this);
                  log.setTextColor(0xFF7CFC9A);
                  log.setTextSize(12f);
                  log.setPadding(0, dp(14), 0, 0);
                  col.addView(log);

                  log("Listo. Archivos en assets/ff: " + contarAssets());
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density);
              }

              private Button btn(String label, android.view.View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(13f);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(0xFF23232E);
                  b.setOnClickListener(l);
                  return b;
              }

              private void log(String s) {
                  log.append(s + "\n");
              }

              private int contarAssets() {
                  try {
                      String[] l = getAssets().list("ff");
                      return l == null ? 0 : l.length;
                  } catch (Exception e) {
                      return 0;
                  }
              }

              private void copiarAManual() {
                  String d = dirField.getText().toString().trim();
                  if (d.isEmpty()) {
                      toast("Escribe una ruta");
                      return;
                  }
                  sp.edit().putString(K_DIR, d).apply();
                  File dest = new File(d);
                  if (!dest.exists() && !dest.mkdirs()) {
                      toast("No se pudo crear la carpeta");
                      log("Error: no se pudo crear " + d);
                      return;
                  }
                  try {
                      int n = copiarAssets(new File(dest, "ff"));
                      log("Copiados " + n + " archivos en " + dest.getAbsolutePath());
                      toast("Listo");
                  } catch (Exception e) {
                      log("Error: " + e.getMessage());
                      toast("Error al copiar");
                  }
              }

              private int copiarAssets(File destDir) throws Exception {
                  if (!destDir.exists()) destDir.mkdirs();
                  String[] list = getAssets().list("ff");
                  int total = 0;
                  if (list == null) return 0;
                  for (String name : list) {
                      String[] sub = getAssets().list("ff/" + name);
                      if (sub != null && sub.length > 0) {
                          File subDir = new File(destDir, name);
                          if (!subDir.exists()) subDir.mkdirs();
                          for (String s : sub) {
                              total += copiarArchivo("ff/" + name + "/" + s, new File(subDir, s));
                          }
                      } else {
                          total += copiarArchivo("ff/" + name, new File(destDir, name));
                      }
                  }
                  return total;
              }

              private int copiarArchivo(String asset, File out) {
                  try (InputStream in = getAssets().open(asset);
                       OutputStream os = new FileOutputStream(out)) {
                      byte[] buf = new byte[8192];
                      int r;
                      while ((r = in.read(buf)) > 0) os.write(buf, 0, r);
                      return 1;
                  } catch (Exception e) {
                      log("Fallo " + asset + ": " + e.getMessage());
                      return 0;
                  }
              }

              private void elegirCarpeta() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION
                          | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(i, PICK_TREE);
              }

              @Override
              protected void onActivityResult(int req, int res, @Nullable Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != PICK_TREE || res != RESULT_OK || data == null || data.getData() == null) return;
                  Uri tree = data.getData();
                  try {
                      getContentResolver().takePersistableUriPermission(
                              tree,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      );
                  } catch (Exception ignored) {
                  }
                  try {
                      DocumentFile root = DocumentFile.fromTreeUri(this, tree);
                      if (root == null) return;
                      DocumentFile ff = root.findFile("ff");
                      if (ff == null || !ff.isDirectory()) ff = root.createDirectory("ff");
                      if (ff == null) {
                          toast("No se pudo crear la carpeta ff");
                          return;
                      }
                      String[] list = getAssets().list("ff");
                      int total = 0;
                      if (list != null) {
                          for (String name : list) {
                              total += copiarAssetSAF(ff, "ff/" + name, name);
                          }
                      }
                      log("Copiados " + total + " archivos via selector en " + root.getName() + "/ff");
                      toast("Listo");
                  } catch (Exception e) {
                      log("Error: " + e.getMessage());
                  }
              }

              private int copiarAssetSAF(DocumentFile dir, String asset, String name) {
                  try {
                      String[] sub = getAssets().list(asset);
                      if (sub != null && sub.length > 0) {
                          DocumentFile d = dir.findFile(name);
                          if (d == null || !d.isDirectory()) d = dir.createDirectory(name);
                          int t = 0;
                          for (String s : sub) {
                              if (d != null) t += copiarAssetSAF(d, asset + "/" + s, s);
                          }
                          return t;
                      }
                      DocumentFile out = dir.findFile(name);
                      if (out == null) out = dir.createFile("application/octet-stream", name);
                      if (out == null) return 0;
                      try (InputStream in = getAssets().open(asset);
                           OutputStream os = getContentResolver().openOutputStream(out.getUri(), "wt")) {
                          if (os == null) return 0;
                          byte[] buf = new byte[8192];
                          int r;
                          while ((r = in.read(buf)) > 0) os.write(buf, 0, r);
                      }
                      return 1;
                  } catch (Exception e) {
                      log("Fallo " + asset + ": " + e.getMessage());
                      return 0;
                  }
              }

              private void backup() {
                  String d = dirField.getText().toString().trim();
                  if (d.isEmpty()) {
                      toast("Escribe una ruta primero");
                      return;
                  }
                  File src = new File(d, "ff");
                  if (!src.exists()) {
                      toast("No hay carpeta ff ahi");
                      return;
                  }
                  File dst = new File(getExternalFilesDir(null), "backup_ff");
                  if (dst.exists()) {
                      File[] old = dst.listFiles();
                      if (old != null) for (File f : old) f.delete();
                  }
                  dst.mkdirs();
                  File[] files = src.listFiles();
                  int n = 0;
                  if (files != null) {
                      for (File f : files) {
                          if (f.isFile()) {
                              try (InputStream in = new java.io.FileInputStream(f);
                                   OutputStream os = new FileOutputStream(new File(dst, f.getName()))) {
                                  byte[] buf = new byte[8192];
                                  int r;
                                  while ((r = in.read(buf)) > 0) os.write(buf, 0, r);
                                  n++;
                              } catch (Exception e) {
                                  log("Fallo backup " + f.getName());
                              }
                          }
                      }
                  }
                  log("Backup de " + n + " archivos en " + dst.getAbsolutePath());
                  toast("Backup listo");
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }
          }
          EOF

