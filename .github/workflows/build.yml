                      render()
                  })

                  return ScrollView(this).apply { addView(col) }
              }

              private fun render() {
                  val ov = if (Settings.canDrawOverlays(this)) "OK" else "FALTA"
                  val ac = if (TouchAccessibilityService.ready()) "OK" else "FALTA"
                  val cap = if (Config.enabled) "ACTIVO" else "PAUSA"
                  status.text = "Superposición: $ov\nAccesibilidad: $ac\nEstado: $cap\n\nrojo ${Config.rojo} · punto ${Config.punto} · zona ${Config.zona}\nretardo ${Config.retardo}ms · tap ${Config.tapMs}ms\n${if (Config.headFlick) "HeadFlick ON ${Config.head}px" else "HeadFlick OFF"}\n${if (Config.modoSostener) "Modo: SOSTENER" else "Modo: TOQUES"}"

                  val err = Logs.leer("ultimo_error.txt").trim()
                  val ev = Logs.leer("eventos.txt").trim().lines().takeLast(14).joinToString("\n")
                  diag.text = buildString {
                      if (err.isBlank()) {
                          append("ULTIMO ERROR: ninguno\n")
                      } else {
                          append("ULTIMO ERROR:\n")
                          append(err.take(1600))
                          append("\n")
                      }
                      append("\nEVENTOS:\n")
                      append(if (ev.isBlank()) "sin eventos" else ev)
                  }
              }

              private fun requestCapture() {
                  if (!Settings.canDrawOverlays(this)) {
                      toast("Primero permite la superposición (paso 1)")
                      return
                  }
                  if (!TouchAccessibilityService.ready()) {
                      toast("Primero activa la accesibilidad (paso 2)")
                      return
                  }
                  val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projLauncher.launch(mpm.createScreenCaptureIntent())
              }

              private fun askNotifications() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }
              }

              private fun toast(msg: String) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
              }
          }
